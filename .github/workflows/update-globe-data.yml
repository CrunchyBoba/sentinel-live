name: Update globe data

# Refreshes globe_data.json (flights, delays, weather, hazards, fuel) and commits it.
# Runs once a day, whenever the script or this file changes, and on demand from
# the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 12 * * *"        # daily at 12:17 UTC (8:17 AM New York in summer, 7:17 in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_globe_data.py"
      - "data/airports.csv"
      - ".github/workflows/update-globe-data.yml"

permissions:
  contents: write

concurrency:
  group: globe-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (only the fuel step needs them)
        run: pip install --quiet yfinance pandas numpy

      - name: Fetch data
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python scripts/update_globe_data.py

      - name: Commit if changed
        run: |
          git config user.name "sentinel-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add globe_data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update globe data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push
          fi
