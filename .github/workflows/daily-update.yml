name: Daily update

# Every day before the U.S. market opens:
#   1. Globe layers   -> data/globe_data.json   (flights, delays, weather, hazards, fuel)
#   2. Models         -> data/sentinel_data.json (prices, EGARCH, TimesFM, HMM, PCA, track record)
#                        data/forecast_log.csv   (append-only record of every forecast)
# The model step skips itself on days with no new market close (weekends, holidays).
# Also runs when the pipeline changes, and on demand: Actions -> Daily update -> Run workflow.
on:
  schedule:
    - cron: "17 12 * * *"          # 12:17 UTC = 7:17 AM New York in winter, 8:17 AM in summer
  workflow_dispatch:
    inputs:
      force_models:
        description: "Re-run the models even if today's close is already logged"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "data/airports.csv"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache the TimesFM model download
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: timesfm-3.0-pytorch

      - name: Install dependencies
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r pipeline/requirements.txt

      - name: Globe layers
        continue-on-error: true
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python pipeline/update_globe_data.py

      - name: Models and track record
        continue-on-error: true
        run: python pipeline/update_model.py ${{ inputs.force_models && '--force' || '' }}

      - name: Commit if changed
        run: |
          git config user.name "sentinel-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily update ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push
          fi
